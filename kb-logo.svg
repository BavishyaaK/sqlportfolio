<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 110" width="170" height="110" role="img" aria-label="KB monogram" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>KB</title>
  <defs>
    <clipPath id="band"><rect x="0" y="5" width="170" height="100"/></clipPath>
  </defs>
  <g clip-path="url(#band)" fill="none" stroke-width="20">
    <!-- K: arms first, then the stem covers their start -->
    <path d="M18 58 L66 -10" stroke="#E50914"/>
    <path d="M18 52 L70 118" stroke="#B1060F"/>
    <!-- B: bowls first, then the stem covers their start -->
    <path d="M102 50 H128 A22.5 22.5 0 0 1 128 95 H102" stroke="#B1060F"/>
    <path d="M102 15 H124 A17.5 17.5 0 0 1 124 50 H102" stroke="#E50914"/>
    <rect x="8" y="5" width="20" height="100" fill="#E50914" stroke="none"/>
    <rect x="92" y="5" width="20" height="100" fill="#E50914" stroke="none"/>
  </g>
</svg>
